name: Build GateBoard EasyTier IPK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Download prebuilt EasyTier for mipsel_24kc
    runs-on: ubuntu-22.04
    steps:
      - name: 下载 EasyTier v2.7.0 mipsel_24kc 官方预编译包
        run: |
          mkdir -p ./artifact/firmware
          cd ./artifact/firmware
          wget -q https://github.com/EasyTier/EasyTier/releases/download/v2.7.0/EasyTier-v2.7.0-mipsel_24kc-22.03.7.zip
          unzip -q EasyTier-v2.7.0-mipsel_24kc-22.03.7.zip
          ls -lh .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: GateBoard-EasyTier-IPK
          path: ./artifact/firmware/
          retention-days: 30
