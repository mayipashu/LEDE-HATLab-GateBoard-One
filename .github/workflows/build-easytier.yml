name: Build GateBoard firmware with EasyTier

on:
  workflow_dispatch:
    inputs:
      enable_squashfs:
        description: 启用 SquashFS 镜像（默认 EXT4）
        type: boolean
        default: false

jobs:
  build:
    name: Build HATLab GateBoard-One + EasyTier
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          repository: maomaowuxian/LEDE-HATLab-GateBoard-One
          ref: main
          fetch-depth: 1

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf swig libtinfo5

      - name: 集成 EasyTier 包（直接放入 package 目录）
        run: |
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier.git tmp/luci-app-easytier
          mv tmp/luci-app-easytier/easytier package/easytier
          mv tmp/luci-app-easytier/easytier-noweb package/easytier-noweb
          mv tmp/luci-app-easytier/luci-app-easytier package/luci-app-easytier

      - name: 预先禁用所有会导致老内核编译失败的包
        run: |
          sed -i '/CONFIG_PACKAGE_kmod-qca-nss/d' HATLab-GateBoard-One.config
          sed -i '/CONFIG_PACKAGE_kmod-fs-virtiofs/d' HATLab-GateBoard-One.config
          sed -i '/CONFIG_PACKAGE_gptfdisk/d' HATLab-GateBoard-One.config
          echo "# CONFIG_PACKAGE_kmod-qca-nss-ecm is not set" >> HATLab-GateBoard-One.config
          echo "# CONFIG_PACKAGE_kmod-fs-virtiofs is not set" >> HATLab-GateBoard-One.config
          echo "# CONFIG_PACKAGE_gptfdisk is not set" >> HATLab-GateBoard-One.config
          echo "CONFIG_PACKAGE_easytier=y" >> HATLab-GateBoard-One.config
          echo "CONFIG_PACKAGE_luci-app-easytier=y" >> HATLab-GateBoard-One.config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> HATLab-GateBoard-One.config
          if [ "${{ inputs.enable_squashfs }}" = "true" ]; then
            sed -i 's/# CONFIG_TARGET_ROOTFS_SQUASHFS is not set/CONFIG_TARGET_ROOTFS_SQUASHFS=y/' HATLab-GateBoard-One.config
          fi

      - name: 运行原项目官方 build.sh
        run: |
          bash ./helper/build.sh

      - name: 收集产物
        run: |
          mkdir -p ./artifact/firmware
          find ./bin/targets/ -type f \( -name "openwrt-*.img.gz" -o -name "openwrt-*.img" -o -name "openwrt-*.tar.gz" -o -name "*.ipk" \) -exec cp -f {} ./artifact/firmware/ \;
          ls -lh ./artifact/firmware/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: GateBoard-EasyTier-Firmware
          path: ./artifact/firmware/
          retention-days: 30
