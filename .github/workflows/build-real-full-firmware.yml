name: Build Real HATLab GateBoard-One Full Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Real Full Firmware
    runs-on: ubuntu-22.04
    steps:
      - name: 检出 lean 官方 LEDE 完整源码
        uses: actions/checkout@v4
        with:
          repository: coolsnowwolf/lede
          ref: master
          fetch-depth: 1

      - name: 安装完整编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf swig libtinfo5

      - name: 应用 HATLab GateBoard-One 完整设备补丁
        run: |
          git clone --depth 1 https://github.com/maomaowuxian/LEDE-HATLab-GateBoard-One.git tmp/gateboard
          cp -rf tmp/gateboard/target/linux/ramips/dts/mt7621_hatlab_gateboard-one.dts target/linux/ramips/dts/
          cp -rf tmp/gateboard/target/linux/ramips/mt7621/base-files target/linux/ramips/mt7621/
          echo 'define Device/hatlab_gateboard-one
  $(Device/dsa-migration)
  $(Device/uimage-lz71)
  DEVICE_VENDOR := HATLab
  DEVICE_MODEL := GateBoard-One
  DEVICE_PACKAGES := kmod-mt7603 kmod-mt7610e wpad-basic-wolfssl kmod-usb2 kmod-usb3
  IMAGE/sysupgrade.bin := append-rootfs | pad-128k | sysupgrade-tar rootfs=$$$$@ | append-metadata
endef
TARGET_DEVICES += hatlab_gateboard-one' >> target/linux/ramips/image/mt7621.mk

      - name: 集成 EasyTier 包
        run: |
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier.git tmp/luci-app-easytier
          mv tmp/luci-app-easytier/easytier package/easytier
          mv tmp/luci-app-easytier/easytier-noweb package/easytier-noweb
          mv tmp/luci-app-easytier/luci-app-easytier package/luci-app-easytier

      - name: 写入 GateBoard 配置
        run: |
          cat > .config <<EOF
CONFIG_TARGET_ramips=y
CONFIG_TARGET_ramips_mt7621=y
CONFIG_TARGET_ramips_mt7621_DEVICE_hatlab_gateboard-one=y
CONFIG_TARGET_ROOTFS_EXT4FS=y
CONFIG_TARGET_EXT4_JOURNAL=y
CONFIG_PACKAGE_easytier=m
CONFIG_PACKAGE_luci-app-easytier=m
CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-base=y
CONFIG_PACKAGE_luci-mod-admin-full=y
CONFIG_PACKAGE_luci-mod-network=y
CONFIG_PACKAGE_luci-mod-status=y
CONFIG_PACKAGE_luci-mod-system=y
CONFIG_PACKAGE_luci-proto-ipv6=y
CONFIG_PACKAGE_luci-proto-ppp=y
CONFIG_PACKAGE_luci-ssl=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
CONFIG_PACKAGE_uhttpd=y
CONFIG_PACKAGE_uhttpd-mod-ubus=y
EOF
          make defconfig

      - name: 下载全部源码
        run: make download -j8

      - name: 编译完整固件
        run: make -j$(nproc) || make -j1 V=s

      - name: 收集产物
        run: |
          mkdir -p ./artifact/firmware
          find ./bin/targets/ -type f -name "openwrt-*.img.gz" -exec cp -f {} ./artifact/firmware/ \;
          ls -lh ./artifact/firmware/

      - name: 上传完整固件
        uses: actions/upload-artifact@v4
        with:
          name: GateBoard-Full-Firmware
          path: ./artifact/firmware/
          retention-days: 30
