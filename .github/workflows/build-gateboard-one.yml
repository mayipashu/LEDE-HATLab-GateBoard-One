name: Build HATLab GateBoard-One Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-gateboard-one.yml'
      - 'HATLab-GateBoard-One.config'
      - 'HATLab-GateBoard-One.feeds'
      - 'package/n2n/**'
      - 'package/tinc/**'
      - 'include/prereq-build.mk'

permissions:
  contents: write

jobs:
  build:
    name: Build GateBoard-One (n2n + tinc + LuCI)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      # 构建脚本里 tar 等自带 "configure 不允许 root 运行" 检查，显式放开
      FORCE_UNSAFE_CONFIGURE: "1"
      CFLAGS: "-Wno-error=format-security"
      CXXFLAGS: "-Wno-error=format-security"
      CPPFLAGS: "-Wno-error=format-security"

    steps:
      - name: Checkout this repo (full device support)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext \
            git libncurses5-dev libz-dev patch python3 python3-distutils python3-setuptools \
            unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs \
            gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo \
            libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool \
            autopoint device-tree-compiler antlr3 gperf swig libtinfo5 dosfstools mtools genisoimage

      - name: Setup feeds (pinned, luci=openwrt-21.02)
        run: |
          set -euo pipefail
          # 用仓库里固定版本的 feeds 定义覆盖默认值，保证可复现
          cp ./HATLab-GateBoard-One.feeds ./feeds.conf.default
          ./scripts/feeds update -a

          # 安装 luci feed 的全部包（-a 与 -p 组合即"只装该 feed"）
          ./scripts/feeds install -a -p luci

          # packages feed 只装本固件真正需要的包。immortalwrt 21.02 的 packages
          # feed 体积庞大且含大量与本树年代/工具链不匹配的包（liburcu 0.15.x 等），
          # 全量安装会让 defconfig 报错。
          if [ -d package/feeds/packages ]; then
            find package/feeds/packages -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

          # 基础依赖（原流程保留）
          ./scripts/feeds install zstd lzo cgi-io luasrcdiet

          # samba4 全家桶 + 它需要的 host/库依赖链
          # 注意：python3 在 imm21 feed 里位于 lang/python/python3；
          # libuuid 由本树 package/utils/util-linux 提供，无需 feed 安装。
          ./scripts/feeds install samba4 2>/dev/null || true
          for p in python3 perl perl-parse-yapp rpcsvc-proto libtasn1 gnutls \
                     libtirpc popt liburing readline avahi libpam attr; do
            ./scripts/feeds install "$p" 2>/dev/null || true
          done

          # USB 打印机
          ./scripts/feeds install p910nd 2>/dev/null || true

          echo "--- package/feeds 内容 ---"
          ls -1 package/feeds/
          ls -1 package/feeds/packages/ || true

      - name: Configure
        run: |
          cp ./HATLab-GateBoard-One.config ./.config
          make defconfig

      - name: Verify required packages survived defconfig
        run: |
          set -euo pipefail
          REQ="luci luci-base luci-app-opkg luci-app-firewall luci-ssl-openssl cgi-io \
               kmod-tun n2n n2n-utils tinc libzstd liblzo \
               odhcpd-ipv6only odhcp6c ipv6helper \
               samba4-server samba4-libs luci-app-samba4 \
               p910nd kmod-usb-printer luci-app-p910nd \
               easytier luci-app-easytier \
               lucky luci-app-lucky \
               frpc luci-app-frpc \
               filebrowser luci-app-filebrowser \
               xray-core luci-app-xray \
               rtp2httpd luci-app-rtp2httpd"
          missing=0
          for s in $REQ; do
            if grep -q "^CONFIG_PACKAGE_${s}=y$" .config; then
              echo "OK      $s"
            else
              echo "::error::required package '$s' missing from .config (feed not installed?)"
              missing=1
            fi
          done
          # 设备目标必须存在，否则镜像根本不会生成
          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_hatlab_gateboard-one=y$' .config \
            || { echo "::error::device hatlab_gateboard-one not selected"; missing=1; }
          exit $missing

      - name: Download sources
        run: |
          make download -j8 || make download -j1 V=s

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        if: success()
        run: |
          set -euo pipefail
          mkdir -p ./artifact/firmware
          find ./bin/targets/ -type f \
            \( -name "*gateboard*" -o -name "*.img" -o -name "*.itb" \
               -o -name "*sha256sums" -o -name "*.manifest" -o -name "profiles.json" \
               -o -name "*.buildinfo" \) \
            -exec cp -f {} ./artifact/firmware/ \;
          ls -lh ./artifact/firmware/

      - name: Verify checksums
        if: success()
        run: |
          set -euo pipefail
          cd ./artifact/firmware
          # kernel-debug.tar.zst 未纳入产物收集，忽略缺失项，只校验实际存在的文件
          sha256sum -c --ignore-missing *sha256sums
          sha256sum *

      - name: Prove new feature binaries are inside the image
        if: success()
        run: |
          ROOT=./staging_dir/target-mipsel_24kc_musl/root-ramips
          for f in usr/bin/n2n-edge usr/bin/n2n-supernode usr/sbin/tincd \
                   etc/init.d/n2n etc/init.d/tinc etc/config/n2n \
                   www/cgi-bin/luci \
                   etc/init.d/odhcpd usr/sbin/odhcpd usr/sbin/odhcp6c \
                   usr/sbin/ksmbd.mountd usr/sbin/smbd \
                   usr/sbin/p910nd etc/init.d/p910nd etc/config/p910nd \
                   usr/bin/easytier-core usr/bin/easytier-cli \
                   etc/init.d/easytier etc/config/easytier \
                   usr/bin/lucky etc/init.d/lucky etc/config/lucky \
                   usr/bin/frpc etc/init.d/frpc etc/config/frpc \
                   usr/bin/filebrowser etc/init.d/filebrowser etc/config/filebrowser \
                   usr/bin/xray \
                   usr/bin/rtp2httpd etc/init.d/rtp2httpd etc/config/rtp2httpd; do
            if [ -e "$ROOT/$f" ]; then
              echo "OK      /$f"
            else
              # samba4 与 ksmbd 二者取其一，缺失不算致命
              case "$f" in
                *ksmbd*|*smbd*) echo "SKIP    /$f (samba 实现可选)" ;;
                *) echo "::error::/$f missing"; exit 1 ;;
              esac
            fi
          done

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HATLab-GateBoard-One-Firmware
          path: ./artifact/firmware/
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            logs/
            .config
          if-no-files-found: ignore

      - name: Publish to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=latest
          NOTES=$(mktemp)
          cp ./RELEASE_NOTES.md "$NOTES"
          printf '\n---\n构建：OpenWrt 21.02.3-r16554-1d4dea6d4f，提交 `%s`\n' "${{ github.sha }}" >> "$NOTES"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "HATLab GateBoard-One 固件（latest）" --latest --notes-file "$NOTES"

          gh release upload "$TAG" \
            ./artifact/firmware/*.img \
            ./artifact/firmware/*.itb \
            ./artifact/firmware/*hatlab_gateboard-one.manifest \
            ./artifact/firmware/*sha256sums \
            --clobber

          gh release edit "$TAG" --notes-file "$NOTES" --latest
          echo "released: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
