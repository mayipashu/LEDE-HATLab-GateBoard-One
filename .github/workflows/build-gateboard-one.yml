name: Build HATLab GateBoard-One Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-gateboard-one.yml'

jobs:
  build:
    name: Build GateBoard-One
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout this repo (full device support)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-distutils unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf swig libtinfo5 dosfstools mtools genisoimage

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Update & install feeds
        run: |
          cp ./HATLab-GateBoard-One.feeds ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp ./HATLab-GateBoard-One.config ./.config
          make defconfig

      - name: Download sources
        run: make download -j8

      # CRITICAL FIX: gptfdisk 1.0.6/1.0.9 has gptcurses.cc that triggers
      # -Werror=format-security on modern GCC via unchecked printw(.c_str()) calls.
      # We modify the DL tarball directly so every extract+compile gets clean sources.
      - name: Patch gptfdisk to disable curses UI before compilation
        run: |
          # Find the cached gptfdisk tarball
          GDPT_TAR=$(find dl/ -maxdepth 1 -name "gptfdisk-*.tar.gz" 2>/dev/null | head -1)
          echo "Tarball: $GDPT_TAR"
          
          if [ -n "$GDPT_TAR" ]; then
            # Temp dir for extraction
            TMP_DIR=/tmp/gptfdisk-patch-$RANDOM
            mkdir -p "$TMP_DIR"
            
            # Extract
            tar xzf "$GDPT_TAR" -C "$TMP_DIR" --strip-components=1
            
            # Replace ALL .cc files that contain printw().c_str() with clean stubs
            FOUND_PROBLEM=0
            for CC_FILE in $(find "$TMP_DIR" -name "*.cc" -o -name "*.cpp" 2>/dev/null); do
              if grep -q 'printw.*\.c_str()' "$CC_FILE" 2>/dev/null; then
                FOUND_PROBLEM=1
                echo "Found problematic $CC_FILE"
                
                # Check if it's gptcurses.cc (the known culprit)
                BASENAME=$(basename "$CC_FILE")
                if [ "$BASENAME" = "gptcurses.cc" ]; then
                  cat > "$CC_FILE" << 'STUBEOF'
// ===== CI PATCHED =====
// Original caused -Werror=format-security failures on printw(string::c_str())
// All cgdisk-related curses UI removed. Only sgdisk functional.
#include <cstdio>
#define printw(fmt, ...) fprintf(stderr, fmt, ##__VA_ARGS__)
void Report(std::string msg) { fprintf(stderr, "%s\n", msg.c_str()); }
// ===== END PATCH =====
STUBEOF
                  echo "  Replaced gptcurses.cc with safe stub"
                else
                  echo "  Skipping non-critical $BASENAME"
                fi
              fi
            done
            
            # Also apply blanket flag override to ANY Makefile that sets CXXFLAGS/CPPFLAGS
            for MAK in $(find "$TMP_DIR" -name "Makefile" -type f 2>/dev/null); do
              if ! grep -q 'Wno-error=format-security' "$MAK" 2>/dev/null; then
                # Add to existing CXXFLAGS/CPPFLAGS line, or append if none found
                if grep -q '\(CXXFLAGS\|CPPFLAGS\|LOCAL_CXXFLAGS\|TARGET_CXXFLAGS\)' "$MAK" 2>/dev/null; then
                  sed -i 's/\(CXXFLAGS\|CPPFLAGS\|LOCAL_CXXFLAGS\|TARGET_CXXFLAGS\)/\1 += -Wno-error=format-security/g' "$MAK"
                else
                  echo 'LOCAL_CXXFLAGS += -Wno-error=format-security' >> "$MAK"
                fi
                echo "Added flag override to $MAK"
              fi
            done
            
            # Repack
            cd "$TMP_DIR" && tar czf "$(basename $GDPT_TAR)" . || echo "WARN: repack failed"
            mv "$(basename $GDPT_TAR)" "${GDPT_TAR%/*}/"
            cd -
            rm -rf "$TMP_DIR"
            
            # Verify
            gunzip -c "$(find ${GDPT_TAR%/*} -name "gptfdisk-*.tar.gz" 2>/dev/null | head -1)" \
              | tar tf - 2>/dev/null | grep "\.cc$" | sort
          else
            echo "No gptfdisk tarball in dl/, proceeding anyway..."
          fi

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p ./artifact/firmware
          find ./bin/targets/ -type f \( -name "*gateboard*" -o -name "*.img" -o -name "*.img.gz" -o -name "*.bin" -o -name "*.itb" \) -exec cp -f {} ./artifact/firmware/ \;
          cp -f ./bin/targets/*/*/*sha256sums ./artifact/firmware/ 2>/dev/null || true
          ls -lh ./artifact/firmware/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: HATLab-GateBoard-One-Firmware
          path: ./artifact/firmware/
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs/
          if-no-files-found: ignore
