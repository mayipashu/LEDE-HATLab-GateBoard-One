name: Build HATLab GateBoard-One Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-gateboard-one.yml'

jobs:
  build:
    name: Build GateBoard-One
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      # Global override to disable format-security warnings-as-errors for ALL packages
      # Fixes gptfdisk gptcurses.cc printw() failures on modern GCC
      export_flags: |
        export CFLAGS="${CFLAGS} -Wno-error=format-security"
        export CXXFLAGS="${CXXFLAGS} -Wno-error=format-security"
        export CPPFLAGS="${CPPFLAGS} -Wno-error=format-security"

    steps:
      - name: Checkout this repo (full device support)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Export flags before all builds
        run: |
          eval "${{ env.export_flags }}"
          echo "CXXFLAGS after override: ${CXXFLAGS}"
          echo "CFLAGS after override: ${CFLAGS}"

      - name: Install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
          CFLAGS: "-Wno-error=format-security"
          CXXFLAGS: "-Wno-error=format-security"
          CPPFLAGS: "-Wno-error=format-security"
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-distutils unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf swig libtinfo5 dosfstools mtools genisoimage

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Update & install feeds
        run: |
          cp ./HATLab-GateBoard-One.feeds ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp ./HATLab-GateBoard-One.config ./.config
          make defconfig

      - name: Download sources
        run: make download -j8

      - name: Patch gptfdisk source tarball directly
        run: |
          GDPT_TAR=$(find dl/ -maxdepth 1 -name "gptfdisk-*.tar.gz" 2>/dev/null | head -1)
          if [ -n "$GDPT_TAR" ]; then
            TMP=/tmp/gptfdisk-patch$$
            mkdir -p $TMP
            tar xzf "$GDPT_TAR" -C $TMP --strip-components=1
            for CCF in $(find $TMP -name "*.cc" -o -name "*.cpp"); do
              if grep -q 'printw.*\.c_str()' "$CCF" 2>/dev/null; then
                cp "$CCF" "${CCF}.bak"
                echo '// patched by CI' > "$CCF"
                echo "Replaced: $CCF"
              fi
            done
            cd $TMP && tar czf "$(basename $GDPT_TAR)" . && mv "$(basename $GDPT_TAR)" ..
            cd - && rm -rf $TMP
          else
            echo "No gptfdisk tarball found, skipping tarball patch"
          fi

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p ./artifact/firmware
          find ./bin/targets/ -type f \( -name "*gateboard*" -o -name "*.img" -o -name "*.img.gz" -o -name "*.bin" -o -name "*.itb" \) -exec cp -f {} ./artifact/firmware/ \;
          cp -f ./bin/targets/*/*/*sha256sums ./artifact/firmware/ 2>/dev/null || true
          ls -lh ./artifact/firmware/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: HATLab-GateBoard-One-Firmware
          path: ./artifact/firmware/
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs/
          if-no-files-found: ignore
